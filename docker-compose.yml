services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medsi_care
      POSTGRES_USER: medsi
      POSTGRES_PASSWORD: medsi
    ports:
      - "5432:5432"
    volumes:
      - medsi-care-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medsi -d medsi_care"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  medsi-care-postgres:
